<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trade In-Up Builder</title>
  <link rel="icon" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="lib/productImport.css" />
  <link rel="stylesheet" href="builder.css" />
</head>
<body class="tb">
  <!-- 뼈대는 08 black friday/lg-bf-builder 의 Content Banner Builder
       (헤더 / 내비 레일 / 팔레트 / 캔버스 / Edit panel) 를 그대로 옮겼다. -->
  <header class="app-header tb-header">
    <a class="brand" href="builder.html" aria-label="Home">
      <img src="lg-logo.svg" alt="LG" />
      <span class="divider"></span>
      <span class="title">Trade In-Up Builder</span>
    </a>

    <div class="tb-steps" id="steps"></div>

    <div class="header-actions">
      <button id="download" type="button" class="tb-pill outline-brand" disabled>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v8M4 6l3 3 3-3M2 11h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Download PNG
      </button>
    </div>
  </header>

  <div class="tb-body">
    <!-- ── 내비 레일 — 64px, 호버하면 라벨이 펼쳐진다 ─────────── -->
    <nav class="tb-rail" aria-label="Builders">
      <div class="tb-rail-inner">
        <a class="tb-rail-row active" href="builder.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="1"/><rect x="3" y="14" width="9" height="7" rx="1"/><rect x="16" y="14" width="5" height="7" rx="1"/></svg>
          <span>Trade In-Up Builder</span>
        </a>

        <!-- 이전 테스트 페이지 — 새 빌더에 기능을 옮길 때 참고용으로 남겨둔다 -->
        <p class="tb-rail-label"><span>Lab</span></p>
        <a class="tb-rail-row" href="composite.html" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span>Product Composite</span>
        </a>
        <a class="tb-rail-row" href="infill.html" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l16-2v16L4 18z"/><path d="m4 14 5-4 4 3 3-2 4 3"/></svg>
          <span>Screen Infill</span>
        </a>
        <a class="tb-rail-row" href="studio.html" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.7-.8 1.7-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.8-1.7 1.7-1.7H17c3 0 5.5-2.5 5.5-5.6C22 6 17.5 2 12 2z"/></svg>
          <span>Studio Scene</span>
        </a>
      </div>
    </nav>

    <!-- ── 왼쪽 — 에셋 팔레트 ─────────────────────────────── -->
    <aside class="tb-side tb-left" id="leftPanel">
      <div class="tb-side-head">
        <p class="tb-side-title">Select Visual Type</p>
      </div>
      <div class="tb-palette" id="palette"></div>
    </aside>

    <div class="tb-drag" id="leftDrag" title="Drag to resize · double-click to reset"></div>

    <!-- ── 가운데 — 캔버스 ───────────────────────────────── -->
    <main class="tb-canvas" id="canvas"></main>

    <div class="tb-drag" id="rightDrag" title="Drag to resize · double-click to reset"></div>

    <!-- ── 오른쪽 — Edit panel ───────────────────────────── -->
    <aside class="tb-side tb-right" id="rightPanel">
      <div class="tb-side-head">
        <p class="tb-side-title">Edit panel</p>
        <p class="tb-side-sub">You can modify the elements included in the visual.</p>
      </div>
      <div id="editBody" class="tb-edit-body"></div>
    </aside>
  </div>

  <script type="module" src="builder-app.js"></script>
</body>
</html>
